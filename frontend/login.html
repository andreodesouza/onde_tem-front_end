<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onde Tem? — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/login.css" />
</head>

<body>
  <main class="tela-login">
    <!-- Fundo estilizado[cite: 3] -->
    <div class="background" aria-hidden="true">
      <img src="assets/img/background.png" alt="" />
    </div>

    <!-- Caixa Central de Login -->
    <section class="square">
      <!-- Botão para voltar à página principal -->
      <a href="index.html" class="btn-voltar-home">← Voltar ao início</a>

      <div class="square-inner">
        <header class="header">
          <div class="logo">
            <img src="assets/img/logo.png" alt="ONDE TEM" />
          </div>
          <h1>Acesse à sua conta</h1>
        </header>

        <!-- Formulário de Login -->
        <form class="login-framer" id="form-login">
          <div class="buttons-login">
            <div class="login-senha">
              <label class="field">
                <input type="email" id="login-email" name="email" placeholder="E-mail" autocomplete="email" required />
              </label>
              <label class="field">
                <input type="password" id="login-senha" name="password" placeholder="Palavra-passe"
                  autocomplete="current-password" required />
              </label>
            </div>

            <div class="keep-container">
              <label class="keep">
                <input type="checkbox" name="keep" />
                <span class="keep-box"></span>
                <span>Manter ligado</span>
              </label>
              <a href="redefinir_senha.html" class="forgot-link">Esqueceu-se da palavra-passe?</a>
            </div>
          </div>

          <button type="submit" class="btn-start">
            Entrar
          </button>
        </form>

        <a class="btn-cadastrar" href="cadastro.html">
          <span>Não tem conta? <strong>Cadastre-se</strong></span>
        </a>
      </div>
    </section>
  </main>

  <script src="js/login.js"></script>
</body>

</html>
