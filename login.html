<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ONDE TEM — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="tela-login" data-node-id="1429:78">
      <div class="background" data-node-id="1476:65" aria-hidden="true">
        <img src="assets/background.png" alt="" width="1436" height="2549" />
      </div>

      <section class="square" data-node-id="1436:8">
        <div class="square-inner">
        <header class="header" data-node-id="1441:228">
          <div class="logo" data-node-id="1441:229">
            <img src="assets/logo.png" alt="ONDE TEM" width="146" height="259" />
          </div>
          <h1 data-node-id="1437:4">Conecte-se com uma conta de</h1>
          <div class="roles" data-node-id="1476:63">
            <button type="button" class="role-btn" data-node-id="1476:38">
              Sou Cliente
            </button>
            <button type="button" class="role-btn role-btn--empresa" data-node-id="1476:61">
              Sou Empresa
            </button>
          </div>
        </header>

        <form class="login-framer" data-node-id="1441:230" action="#" method="post">
          <div class="buttons-login" data-node-id="1441:190">
            <div class="login-senha" data-node-id="1441:186">
              <label class="field" data-node-id="1438:181">
                <span class="visually-hidden">E-mail</span>
                <input type="email" name="email" placeholder="E-mail" autocomplete="email" />
              </label>
              <label class="field" data-node-id="1441:184">
                <span class="visually-hidden">Password</span>
                <input
                  type="password"
                  name="password"
                  placeholder="Password:"
                  autocomplete="current-password"
                />
              </label>
            </div>
            <label class="keep" data-node-id="1441:189">
              <input type="checkbox" name="keep" />
              <span class="keep-box" data-node-id="1441:188"></span>
              <span>Manter conectado</span>
            </label>
          </div>

          <button type="submit" class="btn-start" data-node-id="1441:191">
            Comece agora
          </button>

          <div class="entrar-apps" data-node-id="1441:226">
            <p data-node-id="1441:193">conecte com</p>
            <div class="socials" data-node-id="1441:225">
              <a class="social" href="#" aria-label="Entrar com Google" data-node-id="1441:224">
                <span class="social-icon social-icon--google" data-node-id="1441:205">
                  <img src="assets/google.png" alt="" width="44" height="44" />
                </span>
              </a>
              <a class="social" href="#" aria-label="Entrar com Facebook" data-node-id="1441:223">
                <span class="social-icon social-icon--facebook" data-node-id="1441:208">
                  <img src="assets/facebook.png" alt="" width="65" height="66" />
                </span>
              </a>
              <a class="social" href="#" aria-label="Entrar com Apple" data-node-id="1441:222">
                <span class="social-icon social-icon--apple" data-node-id="1441:220">
                  <img src="assets/apple.png" alt="" width="44" height="44" />
                </span>
              </a>
            </div>
          </div>
        </form>

        <a class="btn-cadastrar" href="#" data-node-id="1536:67">
          <span><strong>Cadastre-se</strong> agora mesmo</span>
        </a>
        </div>
      </section>
    </main>
  </body>
</html>
